# Fly.io config for the static games site. Not deployed yet: Wally runs
# `fly auth login`, then `fly launch --no-deploy --name braven-capstone-games --copy-config`, then `fly deploy`.
app = "braven-capstone-games"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
