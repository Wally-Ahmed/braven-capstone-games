# Fly.io config for the games site served by the Node server (static files + WebSocket room relay at /ws).
# Rooms live in the process's memory, so the machine stays up (no auto-stop) and a deploy resets all rooms.
# Runbook: deploy/FLY-DEPLOY.md. Wally runs `fly auth login` himself; nothing is deployed from here unasked.
app = "braven-capstone-games"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
